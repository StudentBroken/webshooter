; PlatformIO Project Configuration File for ESP32-C3 SuperMini
; Spider-Man Web-Shooter Servo Controller

[env:esp32-c3-webshooter]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Enable USB CDC for Serial monitor over native USB-C
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
